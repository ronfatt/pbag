<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="overlay" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b2d18" stop-opacity="0.96" />
      <stop offset="0.58" stop-color="#0b2d18" stop-opacity="0.72" />
      <stop offset="1" stop-color="#0b2d18" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd36b" />
      <stop offset="1" stop-color="#f4bd45" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="#0b2d18" />

  <g transform="translate(0 285)">
    <rect width="1200" height="630" fill="#113f25" />
    <image href="classroom-learning.jpg" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="0.9" />
    <rect width="1200" height="630" fill="url(#overlay)" />

    <circle cx="96" cy="91" r="46" fill="#ffffff" />
    <image href="pbag-logo.png" x="54" y="49" width="84" height="84" preserveAspectRatio="xMidYMid meet" />

    <text x="166" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">PBAG</text>
    <text x="166" y="118" fill="#ffffff" opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Grace Training Centre, Tawau</text>

    <text x="70" y="286" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900">Give Every Child</text>
    <text x="70" y="360" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900">A Chance To Learn</text>

    <text x="74" y="426" fill="#ffffff" opacity="0.88" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">
      Education, skills training, and community care
    </text>
    <text x="74" y="465" fill="#ffffff" opacity="0.88" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">
      for undocumented children in Tawau, Sabah.
    </text>

    <rect x="70" y="542" width="242" height="46" rx="23" fill="#d9342b" />
    <text x="104" y="572" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">Donate or Sponsor</text>

    <text x="340" y="572" fill="#f4bd45" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">www.pbag.my</text>
  </g>
</svg>
